name: Monitor TeaStar

on:
  schedule:
    - cron: "*/5 * * * *"   # a cada 5 minutos (mínimo permitido pelo GitHub)
  workflow_dispatch:          # permite rodar manualmente pelo botão "Run workflow"

permissions:
  contents: write

concurrency:
  group: monitor-teastar
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install requests beautifulsoup4

      - name: Verificar guerras
        run: python monitor_teastar.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

      - name: Salvar estado
        run: |
          if [ -n "$(git status --porcelain teastar_wars_state.json)" ]; then
            git config user.name "monitor-bot"
            git config user.email "monitor-bot@users.noreply.github.com"
            git add teastar_wars_state.json
            git commit -m "Atualiza estado do monitor"
            git push
          fi
